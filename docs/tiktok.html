<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Connect</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#15171a; --muted:#666c75; --line:#e2e5ea; --accent:#3b5bdb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --text:#eceef2; --muted:#9aa1ad; --line:#2a2f38; --accent:#748ffc; } }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,Segoe UI,sans-serif; }
  main { max-width:560px; margin:48px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  textarea { width:100%; box-sizing:border-box; font:14px ui-monospace,Consolas,monospace; padding:10px; border-radius:8px;
    border:1px solid var(--line); background:var(--bg); color:var(--text); min-height:90px; }
  button { margin-top:10px; padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  p.muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>TikTok connection</h1>
  <div class="card" id="box"></div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const box = document.getElementById("box");
  const code = q.get("code");
  if (code) {
    box.innerHTML = '<p>Signed in. Copy this code and send it to Claude (it works for a few minutes only):</p>' +
      '<textarea id="c" readonly></textarea><button id="b">Copy code</button>';
    document.getElementById("c").value = code;
    document.getElementById("b").onclick = () => {
      navigator.clipboard.writeText(code).then(() => { document.getElementById("b").textContent = "Copied ✓"; });
    };
  } else if (q.get("error")) {
    box.textContent = "TikTok sign-in failed: " + (q.get("error_description") || q.get("error"));
  } else {
    box.innerHTML = '<p>This page receives the TikTok sign-in for the GTA clip bot.</p>' +
      '<p class="muted">See the <a href="privacy.html">privacy policy</a> and <a href="terms.html">terms</a>.</p>';
  }
</script>
</body>
</html>
